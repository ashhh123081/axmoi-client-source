<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Driplite Studio · Live tuning</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<main>
  <header class="masthead"><a class="brand" href="/" aria-label="Drip Lite home">drip<span>lite</span><small>Local console</small></a><div class="connection"><span id="connection-dot" class="dot"></span><span id="connection-text">Connecting</span><button id="refresh" class="quiet" aria-label="Refresh connection">↻</button></div></header>
  <section class="session-bar" aria-label="Sync controls"><div><span class="session-mark">↔</span><span id="sync-text">Reading current configuration…</span><span id="sync-detail" class="subtle"></span></div><div class="session-actions"><button id="undo" class="quiet" disabled>Undo</button><button id="reset-all" class="quiet" disabled>Restore original</button><button id="pause" class="pause" disabled>Pause sync</button></div></section>
  <nav class="category-nav" aria-label="Module categories"><div class="tabs" role="tablist" aria-label="Module categories"><button role="tab" aria-selected="true" data-category="Combat">Combat</button><button role="tab" aria-selected="false" data-category="Visual">Visual</button><button role="tab" aria-selected="false" data-category="Movement">Movement</button><button role="tab" aria-selected="false" data-category="Utility">Utility</button></div><button id="settings" class="icon-button" aria-label="Interface settings" title="Interface settings">⚙</button><button id="profiles" class="icon-button" aria-label="Save and load profiles" title="Save and load profiles">☁</button></nav>
  <div class="list-tools"><div><h1 id="category-title">Combat</h1><span id="module-count" class="subtle"></span></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search modules…" aria-label="Search all modules" autocomplete="off"><kbd>/</kbd></label></div>
  <div id="notice" class="notice" role="status" hidden></div>
  <section id="modules" class="modules" role="tabpanel" aria-label="Combat modules"><div class="loading">Reading modules and parameters…</div></section>
  <footer><span id="footer-status">Local connection only</span><span>Changes read back in about 2 seconds · <button id="mapping-info" class="text-button">Field support</button></span></footer>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dialog"><form method="dialog"><button class="dialog-close quiet" aria-label="Close">×</button></form><div id="dialog-content"></div></dialog>
<input id="import-file" type="file" accept="application/json,.json" hidden>
</body></html>
